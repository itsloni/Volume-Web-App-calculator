<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">

<div class="container">
    <h1>Volume Calculator</h1>
    <p>Enter the three Dimensions to get the volume</p>
    <form form method="POST">
        <div>

            <input placeholder="Length" value="{{dim_1}}" name="first_dim"></input>
            <p></p>
        </div>

        <div>

            <input placeholder="Width" value="{{dim_2}}" name="second_dim"></input>
            <p></p>
        </div>

        <div>

            <input placeholder="Height" value="{{dim_3}}" name="third_dim"></input>
            <p></p>
        </div>
        <p>{{output}}</p>
        <button class="btn btn-solid theme-warning">Calculate</button>
    </form>
</div>
