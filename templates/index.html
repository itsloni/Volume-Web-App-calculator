<div>
    <h1>Volume Calculator</h1>
    <p>Enter the three Dimensions to get the volume</p>
    <form form method="POST">
        <div>
            <p>Length</p>
            <input value="{{dim_1}}" name="first_dim"></input>
        </div>

        <div>
            <p>Width</p>
            <input value="{{dim_2}}" name="second_dim"></input>
        </div>

        <div>
            <p>Height</p>
            <input value="{{dim_3}}" name="third_dim"></input>
        </div>
        <p>{{output}}</p>
        <button>Calculate</button>
    </form>
</div>
